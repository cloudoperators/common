name: Shared GoReleaser

on:
  workflow_call:
    inputs:
      runs-on:
        description: "The runner to use for the job (must be a Linux runner)"
        required: false
        default: "ubuntu-latest"
        type: string
      goreleaser-version:
        description: "GoReleaser version constraint passed to goreleaser-action (e.g. '~> v2')"
        required: false
        default: "~> v2"
        type: string
      goreleaser-config:
        description: "Path to .goreleaser.yaml config file; leave empty to use GoReleaser's default discovery"
        required: false
        default: ""
        type: string
      go-version-file:
        description: "Path to the go.mod file used by setup-go"
        required: false
        default: "go.mod"
        type: string
      environment:
        description: "GitHub environment name to use for this job (e.g. release), for environment protection rules and scoped secrets"
        required: false
        default: ""
        type: string
    secrets:
      release-token:
        description: "Token used for GoReleaser GitHub Release creation; falls back to GITHUB_TOKEN if not provided"
        required: false

jobs:
  goreleaser:
    runs-on: ${{ inputs.runs-on }}
    environment: ${{ inputs.environment != '' && inputs.environment || null }}
    concurrency:
      group: release-${{ github.repository }}
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - name: Validate inputs
        run: |
          if [ "$RUNNER_OS" != "Linux" ]; then
            echo "ERROR: this workflow requires a Linux runner; got: $RUNNER_OS"
            exit 1
          fi

      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5
        with:
          go-version-file: ${{ inputs.go-version-file }}
          cache: true

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@e435ccd777264be153ace6237001ef4d979d3a7a # v6
        with:
          distribution: goreleaser
          version: ${{ inputs.goreleaser-version }}
          args: release --clean${{ inputs.goreleaser-config != '' && format(' --config {0}', inputs.goreleaser-config) || '' }}
        env:
          GITHUB_TOKEN: ${{ secrets.release-token != '' && secrets.release-token || secrets.GITHUB_TOKEN }}
