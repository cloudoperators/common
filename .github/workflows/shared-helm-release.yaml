name: Shared Helm Release

on:
  workflow_call:
    inputs:
      runs-on:
        description: "The runner to use for the job (must be a Linux runner)"
        required: false
        default: "ubuntu-latest"
        type: string
      registry:
        description: "Container registry hostname"
        required: false
        default: "ghcr.io"
        type: string
      chart-dir:
        description: "Path to the chart directory containing Chart.yaml (e.g. charts/myapp)"
        required: true
        type: string
      chart-name:
        description: "Chart name used for the OCI duplicate-version check (must match the name field in Chart.yaml)"
        required: true
        type: string
      helm-version:
        description: "Helm CLI version to install"
        required: false
        default: "v3.17.0"
        type: string
      run-dependency-update:
        description: "Run helm dependency update before packaging"
        required: false
        default: false
        type: boolean
      allow-existing:
        description: "When true, exit 0 instead of failing if the chart version already exists in the registry. Useful when not all charts in a batch have changed."
        required: false
        default: false
        type: boolean
      environment:
        description: "GitHub environment name to use for this job (e.g. release), for environment protection rules and scoped secrets"
        required: false
        default: ""
        type: string
    secrets:
      registry-token:
        description: "Token to authenticate to the container registry; falls back to GITHUB_TOKEN if not provided"
        required: false

jobs:
  helm-release:
    runs-on: ${{ inputs.runs-on }}
    environment: ${{ inputs.environment != '' && inputs.environment || null }}
    concurrency:
      group: helm-release-${{ github.repository }}-${{ inputs.chart-name }}-${{ github.ref }}
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write
    steps:
      - name: Validate inputs
        env:
          CHART_DIR: ${{ inputs.chart-dir }}
        run: |
          if [ "$RUNNER_OS" != "Linux" ]; then
            echo "ERROR: this workflow requires a Linux runner; got: $RUNNER_OS"
            exit 1
          fi
          if [ -z "$CHART_DIR" ]; then
            echo "ERROR: chart-dir is required"
            exit 1
          fi

      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: ${{ inputs.helm-version }}

      - name: Log in to container registry
        uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772 # v3
        with:
          registry: ${{ inputs.registry }}
          username: ${{ github.actor }}
          password: ${{ secrets.registry-token != '' && secrets.registry-token || secrets.GITHUB_TOKEN }}

      - name: Validate chart and check for duplicate version
        id: chart-check
        env:
          CHART_DIR: ${{ inputs.chart-dir }}
          CHART_NAME: ${{ inputs.chart-name }}
          REGISTRY: ${{ inputs.registry }}
          ALLOW_EXISTING: ${{ inputs.allow-existing }}
        run: |
          if [ ! -f "${CHART_DIR}/Chart.yaml" ]; then
            echo "ERROR: chart-dir '${CHART_DIR}' does not contain Chart.yaml"
            exit 1
          fi
          CHART_VERSION=$(helm show chart "${CHART_DIR}" | grep -E '^version:' | head -1 | sed 's/^version:[[:space:]]*//' | tr -d '[:space:]')
          if ! echo "$CHART_VERSION" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+'; then
            echo "ERROR: could not parse semver from chart metadata (got: '$CHART_VERSION')"
            exit 1
          fi
          echo "chart_version=${CHART_VERSION}" >> "$GITHUB_OUTPUT"
          PULL_STDERR=$(helm pull "oci://${REGISTRY}/${{ github.repository }}/charts/${CHART_NAME}" --version "${CHART_VERSION}" 2>&1 >/dev/null) && PULL_EXIT=0 || PULL_EXIT=$?
          if [ "$PULL_EXIT" -eq 0 ]; then
            if [ "$ALLOW_EXISTING" = "true" ]; then
              echo "Chart ${CHART_NAME}:${CHART_VERSION} already exists in OCI registry — skipping (allow-existing=true)"
              echo "skip=true" >> "$GITHUB_OUTPUT"
            else
              echo "ERROR: chart ${CHART_NAME}:${CHART_VERSION} already exists in OCI registry — bump Chart.yaml version before pushing"
              exit 1
            fi
          elif echo "$PULL_STDERR" | grep -qiE 'not found|does not exist|manifest unknown|tag does not exist'; then
            : # version absent — proceed with push
          else
            echo "ERROR: helm pull failed with an unexpected error (auth/network/transport issue):"
            echo "$PULL_STDERR"
            exit 1
          fi

      - name: Run helm dependency update
        if: inputs.run-dependency-update == true && steps.chart-check.outputs.skip != 'true'
        env:
          CHART_DIR: ${{ inputs.chart-dir }}
        run: helm dependency update "$CHART_DIR"

      - name: Package and push Helm chart
        if: steps.chart-check.outputs.skip != 'true'
        env:
          CHART_DIR: ${{ inputs.chart-dir }}
          CHART_NAME: ${{ inputs.chart-name }}
          CHART_VERSION: ${{ steps.chart-check.outputs.chart_version }}
          REGISTRY: ${{ inputs.registry }}
        run: |
          helm package "$CHART_DIR"
          helm push "${CHART_NAME}-${CHART_VERSION}.tgz" "oci://${REGISTRY}/${{ github.repository }}/charts/"
