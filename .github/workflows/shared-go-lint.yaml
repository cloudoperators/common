name: Shared Go Lint

on:
  workflow_call:
    inputs:
      runs-on:
        description: "The runner to use for the job"
        required: false
        default: "ubuntu-latest"
        type: string
      golangci-lint-version:
        description: "golangci-lint version to use"
        required: false
        default: "latest"
        type: string
      timeout:
        description: "Timeout in minutes passed to golangci-lint via --timeout"
        required: false
        default: 10
        type: number
      working-directory:
        description: "Working directory for the job"
        required: false
        default: "."
        type: string
      enable-govulncheck:
        description: "Run govulncheck in addition to golangci-lint"
        required: false
        default: false
        type: boolean
      govulncheck-version:
        description: "Version of govulncheck to use (e.g. latest or v1.1.3)"
        required: false
        default: "latest"
        type: string

jobs:
  lint:
    runs-on: ${{ inputs.runs-on }}
    permissions:
      contents: read
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - name: Validate inputs
        shell: bash
        env:
          TIMEOUT: ${{ inputs.timeout }}
        run: |
          if ! echo "$TIMEOUT" | grep -qE '^[1-9][0-9]*$'; then
            echo "ERROR: timeout must be a positive integer (got: '$TIMEOUT')"
            exit 1
          fi

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: ${{ format('{0}/go.mod', inputs.working-directory) }}
          cache: true
          cache-dependency-path: ${{ format('{0}/go.sum', inputs.working-directory) }}

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: ${{ inputs.golangci-lint-version }}
          working-directory: ${{ inputs.working-directory }}
          args: --timeout=${{ inputs.timeout }}m

      - name: Run govulncheck
        if: inputs.enable-govulncheck == true
        shell: bash
        env:
          GOVULNCHECK_VERSION: ${{ inputs.govulncheck-version }}
        run: |
          if ! echo "$GOVULNCHECK_VERSION" | grep -qE '^(latest|v[0-9]+\.[0-9]+\.[0-9]+)$'; then
            echo "ERROR: govulncheck-version must be 'latest' or a semver tag like v1.2.3 (got: '$GOVULNCHECK_VERSION')"
            exit 1
          fi
          go run "golang.org/x/vuln/cmd/govulncheck@${GOVULNCHECK_VERSION}" ./...
