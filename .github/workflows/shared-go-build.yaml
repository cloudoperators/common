name: Shared Go Build

on:
  workflow_call:
    inputs:
      runs-on:
        description: "The runner to use for the job (must be a Linux or macOS runner; this workflow requires make)"
        required: false
        default: "ubuntu-latest"
        type: string
      working-directory:
        description: "Working directory for the job"
        required: false
        default: "."
        type: string
      build-target:
        description: "The make target to run for the build (e.g. build, build-all, docker-build)"
        required: false
        default: "build"
        type: string
      docker-build:
        description: "Build a Docker image after the Go build (no push; use shared-docker-build-push for pushing)"
        required: false
        default: false
        type: boolean
      image-name:
        description: "Image name used by the docker metadata step (defaults to ghcr.io/<repo>)"
        required: false
        default: ""
        type: string

jobs:
  build:
    runs-on: ${{ inputs.runs-on }}
    permissions:
      contents: read
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Go
        if: inputs.docker-build != true
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: ${{ format('{0}/go.mod', inputs.working-directory) }}
          cache: true
          cache-dependency-path: ${{ format('{0}/go.sum', inputs.working-directory) }}

      - name: Build
        if: inputs.docker-build != true
        env:
          BUILD_TARGET: ${{ inputs.build-target }}
        run: make "$BUILD_TARGET"

      - name: Set up Docker Buildx
        if: inputs.docker-build == true
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      - name: Extract Docker metadata
        if: inputs.docker-build == true
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ inputs.image-name != '' && inputs.image-name || format('ghcr.io/{0}', github.repository) }}

      - name: Build Docker image
        if: inputs.docker-build == true
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: ${{ inputs.working-directory }}
          push: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}